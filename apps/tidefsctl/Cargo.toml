[package]
name = "tidefsctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true

description = "TideFS CLI for operator commands and development harnesses"

[features]
default = []
block-volume = [
    "dep:tidefs-block-volume-adapter-core",
    "dep:tidefs-block-volume-adapter-daemon",
    "dep:tidefs-block-volume-adapter-ublk-control-runtime",
    "dep:tidefs-recovery-loop",
    "dep:tidefs-transport",
]
cluster = [
    "dep:bincode",
    "dep:tidefs-cluster",
    "dep:tidefs-membership-epoch",
    "dep:tidefs-transport",
    "tidefs-local-object-store/cluster-import",
    "tidefs-posix-filesystem-adapter-daemon/cluster",
]
diagnostics = ["dep:tidefs-validation"]
data-policy = [
    "tidefs-local-filesystem/data-policy",
    "tidefs-posix-filesystem-adapter-daemon/data-policy",
]
distributed-repair = ["dep:tidefs-device-removal"]
receive-merge = []
replication-io = [
    "tidefs-local-filesystem/replication-io",
    "tidefs-posix-filesystem-adapter-daemon/replication-io",
]
remote-snapshot = ["replication-io", "dep:tidefs-transport"]
storage-intent = [
    "dep:serde",
    "dep:tidefs-storage-intent-core",
    "dep:tidefs-storage-intent-policy",
]
full = [
    "block-volume",
    "cluster",
    "data-policy",
    "diagnostics",
    "distributed-repair",
    "receive-merge",
    "replication-io",
    "remote-snapshot",
    "storage-intent",
]

[dependencies]
tidefs-auth = { workspace = true }
tidefs-posix-filesystem-adapter-daemon = { workspace = true }
tidefs-block-volume-adapter-core = { workspace = true, optional = true }
tidefs-pool-import = { workspace = true }
tidefs-pool-scan = { workspace = true }
tidefs-validation = { workspace = true, optional = true }
tidefs-recovery-loop = { workspace = true, optional = true }
tidefs-device-removal = { workspace = true, optional = true }
tidefs-types-pool-label-core = { workspace = true }
tidefs-local-object-store = { workspace = true }
tidefs-local-filesystem = { workspace = true }
tidefs-dataset-lifecycle = { workspace = true }
tidefs-dataset-properties = { workspace = true }
tidefs-dataset-feature-flags = { workspace = true }
tidefs-types-dataset-feature-flags-core = { workspace = true }
tidefs-cluster = { workspace = true, optional = true }
tidefs-membership-epoch = { workspace = true, optional = true }
blake3 = "=1.5.5"
tidefs-transport = { workspace = true, optional = true }
tidefs-vfs-engine = { workspace = true }
tidefs-block-volume-adapter-daemon = { workspace = true, optional = true }
tidefs-block-volume-adapter-ublk-control-runtime = { workspace = true, optional = true }
clap = { version = "4", features = ["derive"] }
bincode = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
tidefs-storage-intent-core = { workspace = true, features = ["serde"], optional = true }
tidefs-storage-intent-policy = { workspace = true, optional = true }
tidefs-encryption = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "tidefsctl"
path = "src/main.rs"
